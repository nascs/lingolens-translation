<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingoLens PDF 双栏翻译</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><span aria-hidden="true">文A</span><div><p>LINGOLENS PDF</p><h1>PDF 双栏翻译</h1></div></div>
      <button id="settings-button" class="quiet-button" type="button">AI 设置</button>
    </header>

    <main>
      <section class="source-panel" aria-labelledby="source-title">
        <div class="section-heading"><div><p class="eyebrow">DOCUMENT SOURCE</p><h2 id="source-title">选择 PDF 来源</h2></div><span>最大 50 MiB / 300 页</span></div>
        <form id="url-form" class="url-form">
          <label for="url-input">PDF 网址</label>
          <div><input id="url-input" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/document.pdf" /><button id="url-load-button" class="primary-button" type="button">加载网址</button></div>
        </form>
        <div class="source-divider"><span>或</span></div>
        <label class="file-button" for="file-input"><span>选择本地 PDF</span><input id="file-input" type="file" accept="application/pdf,.pdf" /></label>
      </section>

      <section class="translation-panel" aria-labelledby="translation-title">
        <div class="section-heading"><div><p class="eyebrow">TRANSLATION</p><h2 id="translation-title">文档翻译设置</h2></div><button id="translate-button" class="primary-button" type="button" disabled>开始翻译</button></div>
        <div class="language-controls">
          <label for="source-language">原文语言<select id="source-language"><option value="auto">自动检测</option><option value="en">英语</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></label>
          <span aria-hidden="true">→</span>
          <label for="target-language">目标语言<select id="target-language"><option value="smart" selected>智能选择（中文→英语，其他→简体中文）</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></label>
        </div>
        <p id="detection-result" class="detection-result">等待文档文本检测。</p>
      </section>

      <section class="status-panel" aria-label="处理状态">
        <div><strong id="status-title">尚未加载 PDF</strong><span id="status-message" role="status" aria-live="polite">请输入网址或选择本地文件。</span></div>
        <div class="progress-group"><span id="page-progress">页进度：0 / 0</span><span id="translation-progress">翻译：0 / 0 段</span></div>
      </section>

      <section id="document-view" class="document-view" aria-label="PDF 原页与对应译文"></section>
    </main>
    <script type="module" src="/src/pdf/index.ts"></script>
  </body>
</html>
