<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>LingoLens 快速翻译</title></head>
  <body>
    <main class="quick-shell">
      <header>
        <div class="brand"><span class="mark">文<em>A</em></span><div><p>QUICK TRANSLATE / 快速翻译</p><h1>离开页面，<br /><i>也能随手译</i></h1></div></div>
        <button id="settings-button" class="ghost" type="button">AI 设置</button>
      </header>

      <nav class="tabs" role="tablist" aria-label="翻译方式">
        <button id="tab-text" class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="panel-text">文本</button>
        <button id="tab-image" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-image">图片</button>
      </nav>

      <section id="panel-text" class="panel" role="tabpanel" aria-labelledby="tab-text">
        <div class="language-row">
          <label>原文<select id="text-source"><option value="auto">自动检测</option><option value="en">英语</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></label>
          <span class="arrow" aria-hidden="true">→</span>
          <label>译文<select id="text-target"><option value="smart" selected>智能选择</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></label>
        </div>
        <textarea id="text-input" maxlength="12000" rows="8" placeholder="粘贴或输入文本，Ctrl + Enter 翻译"></textarea>
        <div class="actions">
          <span id="text-note" class="note" role="status"></span>
          <button id="text-copy" class="ghost" type="button" disabled>复制</button>
          <button id="text-translate" class="primary" type="button">翻译</button>
        </div>
        <div id="text-result" class="result" aria-live="polite" hidden></div>
      </section>

      <section id="panel-image" class="panel" role="tabpanel" aria-labelledby="tab-image" hidden>
        <div id="drop-zone" class="drop-zone" tabindex="0">
          <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <p class="drop-title">拖入截图，或按 Ctrl + V 粘贴</p>
          <p class="drop-hint">支持 PNG / JPEG / WebP，长边自动缩到 1600 像素</p>
          <button id="image-choose" class="ghost" type="button">选择图片</button>
        </div>
        <figure id="image-preview-wrap" class="preview" hidden>
          <img id="image-preview" alt="待翻译截图预览" />
          <button id="image-clear" class="ghost" type="button">移除</button>
        </figure>
        <div class="language-row image-row">
          <label>译文<select id="image-target"><option value="zh-CN" selected>简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></label>
          <button id="image-translate" class="primary" type="button" disabled>翻译图片</button>
        </div>
        <p id="image-note" class="note" role="status"></p>
        <button id="image-settings" class="ghost settings-link" type="button" hidden>打开设置更换图片模型</button>
        <details id="image-source-wrap" class="source" hidden>
          <summary>识别到的原文</summary>
          <pre id="image-source"></pre>
        </details>
        <section id="image-result-wrap" class="result-wrap" hidden>
          <div class="result-head"><span>译文</span><button id="image-copy" class="ghost" type="button">复制译文</button></div>
          <div id="image-result" class="result" aria-live="polite"></div>
        </section>
        <p class="privacy">图片会发送到你配置的 AI 服务。若当前模型不支持图片输入，这里会提示你更换「图片模型」。</p>
      </section>
    </main>
    <script type="module" src="/src/quick/index.ts"></script>
  </body>
</html>
