<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>LingoLens 独立翻译</title></head>
  <body>
    <main class="translator-shell">
      <header><a class="brand" href="options.html" title="打开设置"><span>文<em>A</em></span><strong>LingoLens</strong></a><div><p>FOCUS TRANSLATOR / 独立翻译</p><h1>让语言在纸上<br /><i>自然相遇</i></h1></div><button id="settings-button" type="button">AI 设置</button></header>
      <section class="workspace">
        <article class="pane source-pane"><div class="pane-head"><label for="source-language">原文</label><select id="source-language"><option value="auto">自动检测</option><option value="en">英语</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></div><textarea id="source-text" maxlength="12000" placeholder="在这里粘贴或输入要翻译的内容…" autofocus></textarea><div class="pane-foot"><button id="clear-button" type="button">清空</button><span id="character-count">0 / 12,000</span></div></article>
        <button id="swap-button" class="swap-button" type="button" aria-label="交换语言">⇄</button>
        <article class="pane result-pane"><div class="pane-head"><label for="target-language">译文</label><select id="target-language"><option value="smart" selected>智能选择（中文→英语，其他→简体中文）</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></div><div id="result-text" class="result-text" aria-live="polite"><span>译文会出现在这里。</span></div><div class="pane-foot"><span id="provider-status">正在读取 AI 配置…</span><button id="copy-button" type="button" disabled>复制译文</button></div></article>
      </section>
      <div class="action-row"><div id="notice" role="status"></div><button id="translate-button" class="translate-button" type="button"><span>开始翻译</span><span>Ctrl + Enter</span></button></div>
    </main>
    <script type="module" src="/src/translator/index.ts"></script>
  </body>
</html>
