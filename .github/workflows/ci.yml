name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, build, and validate
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Report archive checksum
        run: sha256sum lingolens-extension.zip

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: lingolens-extension
          path: lingolens-extension.zip
          if-no-files-found: error
          retention-days: 14
